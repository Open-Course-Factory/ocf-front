# The Debian mirror on its own hostname (LOCAL_MACHINE_MIRROR_HOST): this
# server serves the mirror and nothing else, so a guest's `..` in its path
# reaches no page of the app, and no cookie of the app's origin goes with it.
server {
    listen 80;
    server_name ${LOCAL_MACHINE_MIRROR_HOST};

    include /etc/nginx/local-machine-mirror.locations;

    location / {
        return 404;
    }
}
