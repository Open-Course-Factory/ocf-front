# Debian packages for the machines that run in learners' browsers (plan rule
# 11): cached here, bounded, lost on a pod restart.
proxy_cache_path /var/cache/nginx/local-apt levels=1:2 keys_zone=local_apt:10m max_size=4g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve file if exists, otherwise fall back to index.html
    # no-cache so browsers always get the latest index.html after redeployments
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite-hashed assets: aggressive caching (content-hash in filename = safe)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Reverse proxy for Incus UI admin iframe (replaces Vite's server.proxy)
    # WebSocket-aware for Incus console connections
    location /api/v1/incus-ui/ {
        proxy_pass ${INCUS_PROXY_TARGET};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Incus UI can be slow to respond
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # A machine in a learner's browser reaches deb.debian.org here, through the
    # tab (unkernel's fetch routes), as /local-machine/apt/<its terminal>/debian/...
    # (and /debian-security/..., the image's security updates).
    # ocf-core says on every request whether that machine may: its run open, its
    # tab connected, the platform switch on. The cache key leaves the machine
    # out, so every learner shares one copy of each package.
    location ~ ^/local-machine/apt/(?<lm_terminal>local-[0-9a-f-]+)(?<lm_path>/debian(-security)?/.*)$ {
        limit_except GET HEAD { deny all; }
        auth_request /_local_machine_apt_access;
        # The name is resolved per request, through the pod's own DNS servers
        # (the Dockerfile reads them from resolv.conf): the front starts even
        # when DNS or egress is down, and follows Debian's CDN as it moves.
        # IPv4 only, as cluster egress may have no IPv6.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $debian_mirror deb.debian.org;
        proxy_pass http://$debian_mirror$lm_path;
        proxy_set_header Host deb.debian.org;
        proxy_cache local_apt;
        proxy_cache_key $lm_path;
        proxy_cache_lock on;
        # Debian says how long each file keeps; a package list without a word
        # is kept a few minutes.
        proxy_cache_valid 200 5m;
    }

    location = /_local_machine_apt_access {
        internal;
        proxy_pass ${INCUS_PROXY_TARGET}/api/v1/local-machines/mirror-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Local-Machine $lm_terminal;
    }

    # Health check endpoint for K8s readiness probe
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Reduce noise in logs
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # application/wasm: unkernel's kernel is 11.3 MB as sent, 4.9 MB gzipped.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
}
