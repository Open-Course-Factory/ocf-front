# Debian packages for the machines that run in learners' browsers (plan rule
# 11): cached here, bounded, lost on a pod restart.
proxy_cache_path /var/cache/nginx/local-apt levels=1:2 keys_zone=local_apt:10m max_size=4g inactive=30d use_temp_path=off;

# The app's origins that may ask that mirror (LOCAL_MACHINE_APP_ORIGINS, one
# entry each from nginx/start.sh); any other gets no CORS header.
map $http_origin $lm_cors_origin {
    default "";
    ${LOCAL_MACHINE_CORS_ORIGINS}
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve file if exists, otherwise fall back to index.html
    # no-cache so browsers always get the latest index.html after redeployments
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite-hashed assets: aggressive caching (content-hash in filename = safe)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Reverse proxy for Incus UI admin iframe (replaces Vite's server.proxy)
    # WebSocket-aware for Incus console connections
    location /api/v1/incus-ui/ {
        proxy_pass ${INCUS_PROXY_TARGET};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Incus UI can be slow to respond
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The Debian mirror of the machines in learners' browsers, when it has no
    # hostname of its own (nginx/start.sh writes this file: empty otherwise).
    include /etc/nginx/local-machine-mirror.app-host;

    # Health check endpoint for K8s readiness probe
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Reduce noise in logs
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # application/wasm: unkernel's kernel is 11.3 MB as sent, 4.9 MB gzipped.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
}
