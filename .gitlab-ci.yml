# ============================================================================
# Workflow rules — avoid duplicate pipelines
# When an MR is open for a branch, only the MR pipeline runs (skip the
# branch-push pipeline that would duplicate the same tests).
# ============================================================================

workflow:
  rules:
    # Tags always run (release pipelines)
    - if: $CI_COMMIT_TAG
    # MR events always run
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Skip branch-push pipelines when an MR is open for that branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Plain branch push (no MR) still runs — e.g. main after merge
    - if: $CI_COMMIT_BRANCH

default:
  tags:
    - ocf-core

# ============================================================================
# Variables
# ============================================================================

variables:
  NODE_VERSION: "22"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ============================================================================
# Stages
# ============================================================================

stages:
  - test     # Used in release component
  - check    # Version validation and auto-tagging
  - build    # Docker image creation on release tags
  - release  # Release creation

# ============================================================================
# Cache Configuration
# ============================================================================

.npm_cache:
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
      - node_modules/
      - .npm/

# ============================================================================
# Test & Type-Check
# ============================================================================

unit-tests:
  stage: test
  image: node:${NODE_VERSION}
  extends: .npm_cache
  script:
    - npm ci --prefer-offline
    - npm test
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

typecheck:
  stage: test
  image: node:${NODE_VERSION}
  extends: .npm_cache
  script:
    - npm ci --prefer-offline
    - npx vue-tsc --noEmit
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

# ============================================================================
# Payment E2E — full-stack Playwright run against a real ocf-core + Casdoor
# stack (Docker-in-Docker) and Stripe test-mode Checkout.
#
# Requirements (see e2e/README-payments.md → "CI setup"):
#   - CI variable STRIPE_TEST_SECRET_KEY (masked): Stripe sandbox sk_test_… key.
#     The job is skipped entirely when it is absent.
#   - CI variable token_jwt_key_test (base64 PEM): same value as in ocf-core.
#   - ocf-core must allow this project in its CI job-token allowlist (the job
#     clones ocf-core to build the backend stack).
# ============================================================================

e2e:payment:
  stage: test
  # Playwright's own image: browsers + system deps preinstalled (saves ~7 min
  # over installing them per run). Keep the tag in lockstep with the
  # @playwright/test version in package.json.
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  # No dind service: the runner exposes the shared host Docker daemon (same as
  # ocf-core's test:auth job), so the stack runs there and this job joins the
  # compose network to reach it by service name.
  cache:
    - key: "${CI_COMMIT_REF_SLUG}-npm"
      paths:
        - node_modules/
        - .npm/
  variables:
    # Unique project name per job so parallel pipelines don't collide
    COMPOSE_PROJECT: "ocf-e2e-${CI_JOB_ID}"
    COMPOSE_FILES: "-f .e2e-core/docker-compose.test.yml -f e2e/ci/docker-compose.core.yml"
    STRIPE_CLI_VERSION: "1.44.0"
    DOCKER_CLI_VERSION: "27.3.1"
    COMPOSE_PLUGIN_VERSION: "2.29.7"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Requires the Stripe sandbox key; skip quietly where it isn't configured
    - if: $STRIPE_TEST_SECRET_KEY == null
      when: never
    # Full-stack E2E is too slow for every MR round-trip: automatic on main
    # (post-merge), on-demand (manual, non-blocking) on MR pipelines.
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    # Docker CLI + compose plugin (static binaries — the node image has neither)
    - curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSL "https://github.com/docker/compose/releases/download/v${COMPOSE_PLUGIN_VERSION}/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
    # Stripe CLI (webhook forwarding)
    - curl -fsSL "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin stripe
    # ocf-core sources: compose stack for postgres/casdoor + backend build context
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@usine.solution-libre.fr/open-course-factory/ocf-core.git" .e2e-core
    # Drop .git before building: its packfiles differ on every clone, and with
    # `COPY . .` that busts BuildKit's content cache — forcing a full Go
    # rebuild (~6 min) even when ocf-core hasn't changed. Without it, an
    # unchanged ocf-core rebuilds from the shared daemon's layer cache.
    - rm -rf .e2e-core/.git
    - echo "$token_jwt_key_test" | base64 -d > .e2e-core/token_jwt_key.pem
    - export CASDOOR_CLIENT_SECRET=$(node -e "console.log(require('./.e2e-core/init_data.json').applications[0].clientSecret)")
    # The webhook signing secret must be known BEFORE ocf-core boots
    - export STRIPE_WEBHOOK_SECRET=$(stripe listen --print-secret --api-key "$STRIPE_TEST_SECRET_KEY")
    - docker compose -p "$COMPOSE_PROJECT" $COMPOSE_FILES up -d --build --wait --wait-timeout 300
    # Join the stack's network so ocf-core-e2e resolves from this job (and from
    # the browser it launches).
    - bash e2e/ci/connect-network.sh "${COMPOSE_PROJECT}_default"
    - stripe listen --api-key "$STRIPE_TEST_SECRET_KEY" --forward-to http://ocf-core-e2e:8080/api/v1/webhooks/stripe > stripe-listen.log 2>&1 &
    - npm ci --prefer-offline
    - bash e2e/ci/seed-e2e.sh http://ocf-core-e2e:8080/api/v1 -p "$COMPOSE_PROJECT" $COMPOSE_FILES
    - VITE_API_URL=ocf-core-e2e:8080 VITE_PROTOCOL=http npm run dev > vite.log 2>&1 &
    - timeout 60 bash -c 'until curl -sf http://localhost:4000 >/dev/null; do sleep 2; done'
  script:
    - OCF_API_URL=http://ocf-core-e2e:8080/api/v1
      E2E_PAYER_EMAIL=1.student@test.com
      E2E_PAYER_PASSWORD=test
      npx playwright test payment-purchase
  after_script:
    - docker compose -p "$COMPOSE_PROJECT" -f .e2e-core/docker-compose.test.yml -f e2e/ci/docker-compose.core.yml logs ocf-core-e2e > ocf-core.log 2>&1 || true
    - docker compose -p "$COMPOSE_PROJECT" -f .e2e-core/docker-compose.test.yml -f e2e/ci/docker-compose.core.yml down -v --remove-orphans || true
  artifacts:
    when: on_failure
    paths:
      - test-results/
      - playwright-report/
      - stripe-listen.log
      - vite.log
      - ocf-core.log
    expire_in: 1 week

# ============================================================================
# Release Component
# ============================================================================

include:
  - component: usine.solution-libre.fr/gitlab/components/release/default@0.3.2
    inputs:
      # Enable all new features
      enable_version_check: true
      enable_docker_build: true
      enable_enhanced_release_notes: true

      # Configure stages to match our pipeline
      check_stage: check
      build_stage: build
      stage: release

      # Version management
      version_file: "VERSION"
      main_branch: "main"
      tag_prefix: "v"

      # Docker build
      dockerfile_path: "Dockerfile"
      build_context: "."

      # Disable old changelog component (using enhanced notes instead)
      disable_changelog: true
