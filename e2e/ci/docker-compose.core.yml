# Overlay adding the ocf-core application on top of ocf-core's own
# docker-compose.test.yml (postgres + mysql + casdoor). Used by the e2e:payment
# CI job:
#
#   docker compose -f .e2e-core/docker-compose.test.yml -f e2e/ci/docker-compose.core.yml up
#
# `.e2e-core/` is a shallow clone of ocf-core made by the job. Compose resolves
# build contexts against the PROJECT directory — the directory of the FIRST -f
# file, i.e. the clone itself — so "." below means the ocf-core clone, exactly
# like the casdoor build context in docker-compose.test.yml.
services:
  ocf-core-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres-test:
        condition: service_healthy
      casdoor-test:
        condition: service_healthy
    # No published ports: the runner shares the host Docker daemon, where host
    # ports collide across jobs. The CI job joins the compose network instead
    # and reaches this service as http://ocf-core-e2e:8080.
    #
    # Explicit resolvers: the compose network's embedded DNS forwards to the
    # host's resolv.conf, which on this runner cannot serve containers —
    # api.stripe.com lookups fail without these.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE: postgres
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ocf_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CASDOOR_ENDPOINT: http://casdoor-test:8000
      # App credentials are dev fixtures from ocf-core's init_data.json, not
      # secrets — the job extracts the secret from the clone at runtime.
      CASDOOR_CLIENT_ID: 66a14cd79de6e4a84e2c
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET}
      CASDOOR_ORGANIZATION_NAME: soli
      CASDOOR_APPLICATION_NAME: ocf
      # development => startup self-seeds a fresh DB: default subscription
      # plans, test users (1.student@test.com/test, ...) and Trial auto-assign.
      ENVIRONMENT: development
      STRIPE_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: http://localhost:4000
      OCF_API_URL: localhost:8080
      FIELD_ENCRYPTION_SECRET: e2e-only-not-a-secret
      EMAIL_VERIFICATION_ENABLED: "false"
      FEATURE_COURSES_ENABLED: "true"
      FEATURE_LABS_ENABLED: "true"
      FEATURE_TERMINALS_ENABLED: "true"
    healthcheck:
      # The runtime image has no node, curl or wget, but has bash: probe the
      # version endpoint over bash's /dev/tcp and require a 200 status line.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/v1/version HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
